[project]
name = "ai-cli-commander"
version = "1.1.0"
description = "MCP server bridging Claude to Antigravity (agy), Codex, Kimi, and Claude via CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.27.0"]

[project.scripts]
# 主入口
ai-cli-commander-server = "ai_commander.server:main"

# 向后兼容旧命令名
ai-commander-server = "ai_commander.server:main"
agy-server    = "ai_commander.server:main"
codex-server  = "ai_commander.server:main"
kimi-server   = "ai_commander.server:main"
claude-server = "ai_commander.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
